[package]
name = "whonex"
version = "0.3.0"
edition = "2021"
description = "WHONEX - Evidence-based Security Assessment Engine"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2.5"
